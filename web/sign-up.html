<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign Up | GameCrate.lk</title>
        <link rel="icon" type="image/png" href="assets/images/logo.png">

        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- Font Awesome -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css" />

        <!-- Custom CSS -->
        <link rel="stylesheet" href="assets/css/style.css">
    </head>

    <body class="background-img">

        <!-- PAGE-SPECIFIC CONTENT GOES HERE -->
        <div class="container vh-100 d-flex align-items-center justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card" style="background-color: var(--secondary-bg);">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h2 class="accent-text fw-bold">Sign Up</h2>
                            <p>Create a new Game Crate account to start shopping!</p>
                            <p class="text-danger" id="message"></p>
                        </div>
                        <form>
                            <div class="mb-3">
                                <label for="firstName" class="form-label">First Name</label>
                                <input type="text" class="form-control" id="firstName">
                            </div>
                            <div class="mb-3">
                                <label for="lastName" class="form-label">Last Name</label>
                                <input type="text" class="form-control" id="lastName">
                            </div>
                            <div class="mb-3">
                                <label for="mobile" class="form-label">Mobile Number</label>
                                <input type="text" class="form-control" id="mobile">
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="email">
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password">
                            </div>
                            <button onclick="signUp(event);" type="submit" class="btn btn-primary w-100 mt-3">Sign Up</button>
                            <div class="text-center mt-4">
                                <p>Already have an account? <a href="sign-in.html" class="accent-text">Sign In</a></p>
                            </div>
                        </form>
                    </div>
                </div>
                <footer class="fixed-bottom">
                    <div class="text-center text-white-50">
                        <p>© 2025 GameCrate.LK. All Rights Reserved.</p>
                    </div>
                </footer>
            </div>
        </div>

        <!-- JQuery -->
        <script src="https://code.jquery.com/jquery-3.6.3.min.js"></script>
        <!-- Bootstrap JS Bundle -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Custom JS -->
        <script src="assets/js/script.js"></script>
        <script src="assets/js/sign-up.js"></script>
    </body>

</html>
