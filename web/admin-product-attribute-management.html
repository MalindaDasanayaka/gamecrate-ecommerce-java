<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Product Attribute Management | GameCrate.lk Admin</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css" />
        <link rel="stylesheet" href="assets/css/admin-style.css">
        <link rel="stylesheet" href="assets/css/notification.css">
        <link rel="icon" type="image/png" href="assets/images/logo.png">
    </head>

    <body onload="loadSidebar();loadProductData();">
        <div class="wrapper">
            <!-- Sidebar -->
            <div id="sidebar"></div>

            <!-- Main Content -->
            <div class="main-content">
                <!-- Top Navbar -->
                <nav class="navbar navbar-expand-lg navbar-dark top-navbar">
                    <button class="btn btn-outline-light d-lg-none" id="sidebar-toggle"><i class="fas fa-bars"></i></button>
                    <div class="ms-auto">
                        <ul class="navbar-nav">
                            <li class="nav-item">
                                <a class="nav-link">
                                    <i class="fas fa-user-shield me-2"></i>
                                    Admin
                                    <span class="accent-text" id="adminEmail"> admin@gmail.com</span>
                                </a>
                            </li>
                        </ul>
                    </div>
                </nav>

                <!-- ================================== -->
                <!--   PAGE-SPECIFIC CONTENT GOES HERE  -->
                <!-- ================================== -->
                <main class="container-fluid">
                    <h1 class="h3 mb-4">Manage Product Attributes</h1>
                    <p class="text-danger" id="message"></p>
                    <div class="row">
                        <!-- Manage Categories -->
                        <div class="col-lg-3 mb-4">
                            <div class="card">
                                <div class="card-header">Categories</div>
                                <div class="card-body">
                                    <!-- List of categories -->
                                    <div class="table-responsive">
                                        <table class="table table-striped table-hover">
                                            <tbody id="category-table">
                                                <tr>
                                                    <td>1</td>
                                                    <td>Consoles</td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                    <!-- Add form -->
                                    <div class="input-group mt-3">
                                        <input id="category" type="text" class="form-control" placeholder="New Category">
                                        <input type="hidden" id="category-id">
                                        <button onclick="submitAttribute('category', 'POST');" class="btn btn-primary" type="button">Add</button>
                                        <button onclick="submitAttribute('category', 'PUT');" class="btn btn-outline-light" type="button">Update</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- Manage Platforms -->
                        <div class="col-lg-3 mb-4">
                            <div class="card">
                                <div class="card-header">Platforms</div>
                                <div class="card-body">
                                    <!-- List of categories -->
                                    <div class="table-responsive">
                                        <table class="table table-striped table-hover">
                                            <tbody id="platform-table">
                                                <tr>
                                                    <td>1</td>
                                                    <td>Consoles</td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                    <!-- Add form -->
                                    <div class="input-group mt-3">
                                        <input id="platform" type="text" class="form-control" placeholder="New Platform">
                                        <input type="hidden" id="platform-id">
                                        <button onclick="submitAttribute('platform', 'POST');" class="btn btn-primary" type="button">Add</button>
                                        <button onclick="submitAttribute('platform', 'PUT');" class="btn btn-outline-light" type="button">Update</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- Manage Genres -->
                        <div class="col-lg-3 mb-4">
                            <div class="card">
                                <div class="card-header">Genres</div>
                                <div class="card-body">
                                    <!-- List of categories -->
                                    <div class="table-responsive">
                                        <table class="table table-striped table-hover">
                                            <tbody id="genre-table">
                                                <tr>
                                                    <td>1</td>
                                                    <td>Consoles</td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                    <!-- Add form -->
                                    <div class="input-group mt-3">
                                        <input id="genre" type="text" class="form-control" placeholder="New Genre">
                                        <input type="hidden" id="genre-id">
                                        <button onclick="submitAttribute('genre', 'POST');" class="btn btn-primary" type="button">Add</button>
                                        <button onclick="submitAttribute('genre', 'PUT');" class="btn btn-outline-light" type="button">Update</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- Manage Delivery Prices -->
                        <div class="col-lg-3 mb-4">
                            <div class="card">
                                <div class="card-header">Delivery Price</div>
                                <div class="card-body">
                                    <!-- List of categories -->
                                    <div class="table-responsive">
                                        <table class="table table-striped table-hover">
                                            <tbody id="delivery-table">
                                                <tr>
                                                    <td>Within Kurunegala</td>
                                                    <td>Rs.<span>100.00</span></td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                    <!-- Add form -->
                                    <div class="input-group mt-3">
                                        <input id="delivery" type="text" class="form-control">
                                        <input type="hidden" id="delivery-id">
                                        <button onclick="updatePrice();" class="btn btn-outline-light" type="button">Update</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>

            </div>
        </div>

        <!-- Scripts -->
        <script src="https://code.jquery.com/jquery-3.6.3.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="assets/js/admin-script.js"></script>
        <script src="assets/js/notification.js"></script>
        <script src="assets/js/admin-sign-out.js"></script>
        <script src="assets/js/admin-pro-att-management.js"></script>

        <!-- Scroll to Top Button -->
        <button class="scroll-to-top" id="scrollToTop" title="Scroll to top">
            <i class="fas fa-arrow-up"></i>
        </button>
    </body>

</html>
