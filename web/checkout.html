<!DOCTYPE html>
<html lang="en">
    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Checkout | GameCrate.lk</title>
        <link rel="icon" type="image/png" href="assets/images/logo.png">

        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- Font Awesome -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css" />

        <!-- Custom CSS -->
        <link rel="stylesheet" href="assets/css/style.css">
        <link rel="stylesheet" href="assets/css/notification.css">
    </head>
    
    <body onload="loadHeaderFooter();">

        <!-- NAVBAR GOES HERE -->
        <div id="header"></div>

        <!-- PAGE-SPECIFIC CONTENT GOES HERE -->
        <div class="container" style="padding-top: 120px;">
            <h1 class="section-title">Shipping Details</h1>
            <div class="row">
                <!-- Left Column: Shipping Details -->
                <div class="col-lg-7">
                    <div class="profile-content">
                        <!-- Address Selection -->
                        <div id="address-list">

                        </div>

                        <!-- Shipping Form (Initially Hidden) -->
                        <div class="new-address-form-container">
                            <form>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="firstName" class="form-label">First Name</label>
                                        <input type="text" class="form-control" id="firstName" disabled>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="lastName" class="form-label">Last Name</label>
                                        <input type="text" class="form-control" id="lastName" disabled>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="mobile" class="form-label">Mobile Number</label>
                                        <input type="text" class="form-control" id="mobile" disabled>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="email" class="form-label">Email Address</label>
                                        <input type="email" class="form-control" id="email" disabled>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="lineOne" class="form-label">Address Line 1</label>
                                        <input type="text" class="form-control" id="lineOne">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="lineTwo" class="form-label">Address Line 2</label>
                                        <input type="text" class="form-control" id="lineTwo">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="city-select" class="form-label">City</label>
                                        <select id="city-select" class="form-select">
                                            <option value="0">Select</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="postalCode" class="form-label">Postal Code</label>
                                        <input type="text" class="form-control" id="postalCode">
                                        <input type="hidden" id="addressId" value="0">
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Right Column: Order Summary -->
                <div class="col-lg-5 mt-4 mt-lg-0">
                    <div class="order-summary-card">
                        <h3 class="card-title">Your Order</h3>
                        <div class="summery-table-wrap">
                            <table class="table summery-table">
                                <thead>
                                    <tr>
                                        <th>Product</th>
                                        <th>Subtotal</th>
                                    </tr>
                                </thead>
                                <tbody id="st-tbody">

                                    <tr class="order-product" id="st-item-tr">
                                        <td>
                                            <span id="st-product-title">Product-1</span> x 
                                            <span class="quantity" id="st-product-qty">1</span>
                                        </td>
                                        <td>Rs.<span id="st-product-price"></span></td>
                                    </tr>

                                    <tr class="order-subtotal" id="st-subtotal-tr">
                                        <td>Subtotal</td>
                                        <td>Rs.<span id="st-product-total-amount"></span>
                                        </td>
                                    </tr>

                                    <tr class="order-shipping" id="st-order-shipping-tr">
                                        <td colspan="2">
                                            <div class="shipping-amount">
                                                <span class="title">Shipping Charges</span>
                                                <span class="amount">Rs.<span id="st-product-shipping-charges">1,000.00</span>
                                                </span>
                                            </div>

                                        </td>
                                    </tr>

                                    <tr class="order-total" id="st-order-total-tr">
                                        <td>Total</td>
                                        <td class="order-total-amount" style="color: var(--accent-color);">Rs.<span id="st-order-total-amount">251,000.00</span>
                                        </td>
                                    </tr>

                                </tbody>
                            </table>
                        </div>

                        <div class="payment-method">
                            <div class="d-flex justify-content-between align-items-center">
                                <label for="cardPayment" class="fw-bold">
                                    Visa/Master Card
                                </label>
                                <div class="payment-logos">
                                    <i class="fab fa-cc-visa"></i>
                                    <i class="fab fa-cc-mastercard"></i>
                                </div>
                            </div>
                            <small class="text-white-50">You can pay with your credit or debit card.</small>
                        </div>

                        <button type="button" class="btn btn-primary w-100 mt-4" onclick="checkout();">Process to Checkout</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- FOOTER GOES HERE -->
        <div id="footer"></div>

        <script type="text/javascript" src="https://www.payhere.lk/lib/payhere.js"></script>

        <!-- JQuery -->
        <script src="https://code.jquery.com/jquery-3.6.3.min.js"></script>
        <!-- Bootstrap JS Bundle -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Custom JS -->
        <script src="assets/js/script.js"></script>
        <script src="assets/js/notification.js"></script>
        <script src="assets/js/checkout.js"></script>

        <!-- Scroll to Top Button -->
        <button class="scroll-to-top" id="scrollToTop" title="Scroll to top">
            <i class="fas fa-arrow-up"></i>
        </button>

    </body>
</html>
