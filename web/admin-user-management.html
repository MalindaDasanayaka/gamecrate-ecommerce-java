<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>User Management | GameCrate.lk Admin</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css" />
        <link rel="stylesheet" href="assets/css/admin-style.css">
        <link rel="stylesheet" href="assets/css/notification.css">
        <link rel="icon" type="image/png" href="assets/images/logo.png">
    </head>

    <body onload="loadSidebar();loadTable(0);">
        <div class="wrapper">
            <!-- Sidebar -->
            <div id="sidebar"></div>

            <!-- Main Content -->
            <div class="main-content">
                <!-- Top Navbar -->
                <nav class="navbar navbar-expand-lg navbar-dark top-navbar">
                    <button class="btn btn-outline-light d-lg-none" id="sidebar-toggle"><i class="fas fa-bars"></i></button>
                    <div class="ms-auto">
                        <ul class="navbar-nav">
                            <li class="nav-item">
                                <a class="nav-link">
                                    <i class="fas fa-user-shield me-2"></i>
                                    Admin
                                    <span class="accent-text" id="adminEmail"> admin@gmail.com</span>
                                </a>
                            </li>
                        </ul>
                    </div>
                </nav>


                <!-- ================================== -->
                <!--   PAGE-SPECIFIC CONTENT GOES HERE  -->
                <!-- ================================== -->
                <main class="container-fluid">
                    <div class="d-flex justify-content-between align-items-center">
                        <h1 class="h3 mb-4">User Management</h1>
                    </div>

                    <div class="card">
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-striped table-hover">
                                    <thead>
                                        <tr>
                                            <th>Id</th>
                                            <th>Name</th>
                                            <th>Email</th>
                                            <th>Mobile</th>
                                            <th>Registered</th>
                                            <th>Status</th>
                                            <th>Action</th>
                                        </tr>
                                    </thead>
                                    <tbody id="user-table-body">
                                        <tr id="user-table-tr">
                                            <td class="user-table-id">1</td>
                                            <td class="user-table-name">John Doe</td>
                                            <td class="user-table-email">john.doe@example.com</td>
                                            <td class="user-table-mobile">0778172488</td>
                                            <td class="user-table-registered">2023-08-15</td>
                                            <td><span class="status-color badge bg-success">Active</span></td>
                                            <td>
                                                <button class="status-button btn btn-sm btn-outline-danger">Block</button>
                                            </td>
                                        </tr>
                                        <!-- more rows -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <div class="text-center mt-5" id="pagination-container">
                        <a href="#" class="pagination-btn" id="pagination-button">Prev</a>
                    </div>
                </main>

            </div>
        </div>

        <!-- Scripts -->
        <script src="https://code.jquery.com/jquery-3.6.3.min.js"></script>

        <script src="assets/js/admin-script.js"></script>
        <script src="assets/js/notification.js"></script>
        <script src="assets/js/admin-sign-out.js"></script>
        <script src="assets/js/admin-user-management.js"></script>
    </body>

</html>
