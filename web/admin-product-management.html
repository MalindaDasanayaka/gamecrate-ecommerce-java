<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Product Management | GameCrate.lk Admin</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css" />
        <link rel="stylesheet" href="assets/css/admin-style.css">
        <link rel="stylesheet" href="assets/css/notification.css">
        <link rel="icon" type="image/png" href="assets/images/logo.png">
    </head>

    <body onload="loadSidebar();loadProductData();">
        <div class="wrapper">
            <!-- Sidebar -->
            <div id="sidebar"></div>

            <!-- Main Content -->
            <div class="main-content">
                <!-- Top Navbar -->
                <nav class="navbar navbar-expand-lg navbar-dark top-navbar">
                    <button class="btn btn-outline-light d-lg-none" id="sidebar-toggle"><i class="fas fa-bars"></i></button>
                    <div class="ms-auto">
                        <ul class="navbar-nav">
                            <li class="nav-item">
                                <a class="nav-link">
                                    <i class="fas fa-user-shield me-2"></i>
                                    Admin
                                    <span class="accent-text" id="adminEmail"> admin@gmail.com</span>
                                </a>
                            </li>
                        </ul>
                    </div>
                </nav>

                <!-- ================================== -->
                <!--   PAGE-SPECIFIC CONTENT GOES HERE  -->
                <!-- ================================== -->
                <main class="container-fluid">
                    <div class="d-flex justify-content-between align-items-center">
                        <h1 class="h3 mb-4">Product Management</h1>
                    </div>

                    <div class="card p-4 mb-5">
                        <form>
                            <div class="row">
                                <div class="col-12 mb-3">
                                    <label for="title" class="form-label">Title</label>
                                    <input type="text" class="form-control" id="title">
                                    <input type="text" class="form-control" id="product-id" hidden>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="category" class="form-label">Category</label>
                                    <select id="category" class="form-select">
                                        <option value="0">Select</option>
                                    </select>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="platform" class="form-label">Platform</label>
                                    <select id="platform" class="form-select">
                                        <option value="0">Select</option>
                                    </select>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="genre" class="form-label">Genre</label>
                                    <select id="genre" class="form-select">
                                        <option value="0">Select</option>
                                    </select>
                                </div>
                                <div class="col-12 mb-3">
                                    <label for="description" class="form-label">Description</label>
                                    <textarea class="form-control" id="description" cols="1" rows="5"></textarea>
                                </div>
                                <div class="col-md-8 mb-3">
                                    <label for="price" class="form-label">Price</label>
                                    <input type="text" class="form-control" pattern="^\d+(\.\d{2})?$" placeholder="0.00"
                                           id="price">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="qty" class="form-label">Quantity</label>
                                    <input id="qty" type="number" class="form-control" min="1" value="1">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="img1" class="form-label">Image 1</label>
                                    <input id="img1" class="form-control" type="file" accept="image/*">
                                </div>

                                <div class="col-md-4 mb-3">
                                    <label for="img2" class="form-label">Image 2</label>
                                    <input id="img2" class="form-control" type="file" accept="image/*">
                                </div>

                                <div class="col-md-4 mb-3">
                                    <label for="img3" class="form-label">Image 3</label>
                                    <input id="img3" class="form-control" type="file" accept="image/*">
                                </div>
                            </div>
                            <button onclick="saveProduct(event);" type="submit" class="btn btn-primary mt-3" id="saveBtn">Add Product To Listing</button>
                            <button onclick="updateProduct(event);" type="submit" class="btn btn-primary mt-3" id="updateBtn" style="display: none;">Update Product</button>
                        </form>
                    </div>

                    <div class="card">
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-striped table-hover align-middle">
                                    <thead>
                                        <tr>
                                            <th>Id</th>
                                            <th>Title</th>
                                            <th>Category</th>
                                            <th>Platform</th>
                                            <th>Genre</th>
                                            <th>Price</th>
                                            <th>Quantity</th>
                                            <th>Registered</th>
                                            <th>Status</th>
                                            <th class="text-center">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody id="product-table-body">
                                        <tr id="product-table-tr">
                                            <td class="product-table-id">1</td>
                                            <td class="product-table-title">PlayStation 5 Console</td>
                                            <td class="product-table-category">Console</td>
                                            <td class="product-table-category-id" hidden></td>
                                            <td class="product-table-platform">PlayStation 5</td>
                                            <td class="product-table-platform-id" hidden></td>
                                            <td class="product-table-genre">Not Applicable</td>
                                            <td class="product-table-genre-id" hidden></td>
                                            <td class="product-table-description" hidden></td>
                                            <td>Rs.<span class="product-table-price">200.00</span></td>
                                            <td class="product-table-qty">50</td>
                                            <td class="product-table-registered">2023-08-15</td>
                                            <td><span class="status-color badge bg-success">Active</span></td>
                                            <td class="text-center">
                                                <button class="update-button btn btn-sm btn-primary">Update</button>
                                                <button class="status-button btn btn-sm btn-outline-danger">Discontinue</button>
                                            </td>
                                        </tr>
                                        <!-- more rows -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    
                    <div class="text-center mt-5" id="pagination-container">
                        <a href="#" class="pagination-btn" id="pagination-button">Prev</a>
                    </div>
                </main>

            </div>
        </div>

        <!-- Scripts -->
        <script src="https://code.jquery.com/jquery-3.6.3.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="assets/js/admin-script.js"></script>
        <script src="assets/js/notification.js"></script>
        <script src="assets/js/admin-sign-out.js"></script>
        <script src="assets/js/product-listing.js"></script>

        <!-- Scroll to Top Button -->
        <button class="scroll-to-top" id="scrollToTop" title="Scroll to top">
            <i class="fas fa-arrow-up"></i>
        </button>
    </body>

</html>
