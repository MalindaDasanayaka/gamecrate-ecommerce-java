<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Order Management | GameCrate.lk Admin</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css" />
        <link rel="stylesheet" href="assets/css/admin-style.css">
        <link rel="stylesheet" href="assets/css/notification.css">
        <link rel="icon" type="image/png" href="assets/images/logo.png">
    </head>

    <body onload="loadSidebar();loadTable(0);">
        <div class="wrapper">
            <!-- Sidebar -->
            <div id="sidebar"></div>

            <!-- Main Content -->
            <div class="main-content">
                <!-- Top Navbar -->
                <nav class="navbar navbar-expand-lg navbar-dark top-navbar">
                    <button class="btn btn-outline-light d-lg-none" id="sidebar-toggle"><i class="fas fa-bars"></i></button>
                    <div class="ms-auto">
                        <ul class="navbar-nav">
                            <li class="nav-item">
                                <a class="nav-link">
                                    <i class="fas fa-user-shield me-2"></i>
                                    Admin
                                    <span class="accent-text" id="adminEmail"> admin@gmail.com</span>
                                </a>
                            </li>
                        </ul>
                    </div>
                </nav>

                <!-- ================================== -->
                <!--   PAGE-SPECIFIC CONTENT GOES HERE  -->
                <!-- ================================== -->
                <main class="container-fluid">
                    <h1 class="h3 mb-4">Order Management</h1>
                    <div class="card">
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-striped table-hover">
                                    <thead>
                                        <tr>
                                            <th>#</th>
                                            <th>Order ID</th>
                                            <th>User</th>
                                            <th>Address</th>
                                            <th>Mobile</th>
                                            <th>Date</th>
                                            <th>Total</th>
                                            <th>Status</th>
                                            <th>Action</th>
                                            <th</th>
                                        </tr>
                                    </thead>
                                    <tbody id="order-table-body">
                                        <tr id="order-table-tr">
                                            <td>1</td>
                                            <td>#<span class="order-table-id">12543</span></td>
                                            <td>John Doe</td>
                                            <td>Address Line 1, <br/>
                                                Address Line 2, <br/>
                                                City, Postal Code
                                            </td>
                                            <td>0778172488</td>
                                            <td>2023-10-26</td>
                                            <td>$574.98</td>
                                            <td>
                                                <span class="status-badge badge bg-dark">Paid</span>
                                            </td>
                                            <td>
                                                <button class="btn btn-sm btn-primary status-button">Process</button>
                                            </td>
                                            <td class="justify-content-end">
                                               <button class="btn btn-sm btn-outline-success view-btn"
                                                        data-bs-toggle="collapse"
                                                        data-bs-target="#collapse-1"
                                                        aria-expanded="false"
                                                        aria-controls="collapse-1">
                                                    <i class="fa fa-chevron-down" aria-hidden="true"></i>
                                                </button> 
                                            </td>
                                        </tr>
                                        <!-- Collapsible Row -->
                                        <tr class="collapse" id="collapse-1">
                                            <td colspan="10">
                                                <div class="order-items-placeholder">
                                                    <table class="table table-striped table-hover">
                                                        <thead>
                                                            <tr>
                                                                <th>Title</th>
                                                                <th>Qty</th>
                                                                <th>Subtotal</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            <tr>
                                                                <td>PlayStation 5 Console</td>
                                                                <td>2</td>
                                                                <td>Rs.500.00</td>
                                                            </tr>
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    
                    <div class="text-center mt-5" id="pagination-container">
                        <a href="#" class="pagination-btn" id="pagination-button">Prev</a>
                    </div>
                </main>

            </div>
        </div>

        <!-- Scripts -->
        <script src="https://code.jquery.com/jquery-3.6.3.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="assets/js/admin-script.js"></script>
        <script src="assets/js/notification.js"></script>
        <script src="assets/js/admin-order-management.js"></script>
        <script src="assets/js/admin-sign-out.js"></script>
        
         <!-- Scroll to Top Button -->
        <button class="scroll-to-top" id="scrollToTop" title="Scroll to top">
            <i class="fas fa-arrow-up"></i>
        </button>
    </body>

</html>
