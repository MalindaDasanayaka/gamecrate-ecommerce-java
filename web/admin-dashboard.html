<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dashboard | GameCrate.lk Admin</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css" />
        <link rel="stylesheet" href="assets/css/admin-style.css">
        <link rel="stylesheet" href="assets/css/notification.css">
        <link rel="icon" type="image/png" href="assets/images/logo.png">
    </head>

    <body onload="loadSidebar();loadData();">
        <div class="wrapper">
            <!-- Sidebar -->
            <div id="sidebar"></div>

            <!-- Main Content -->
            <div class="main-content">
                <!-- Top Navbar -->
                <nav class="navbar navbar-expand-lg navbar-dark top-navbar">
                    <button class="btn btn-outline-light d-lg-none" id="sidebar-toggle"><i class="fas fa-bars"></i></button>
                    <div class="ms-auto">
                        <ul class="navbar-nav">
                            <li class="nav-item">
                                <a class="nav-link">
                                    <i class="fas fa-user-shield me-2"></i>
                                    Admin
                                    <span class="accent-text" id="adminEmail"> admin@gmail.com</span>
                                </a>
                            </li>
                        </ul>
                    </div>
                </nav>

                <!-- ================================== -->
                <!--   PAGE-SPECIFIC CONTENT GOES HERE  -->
                <!-- ================================== -->
                <main class="container-fluid">
                    <h1 class="h3 mb-4">Dashboard</h1>

                    <!-- Stat Cards -->
                    <div class="row">
                        <div class="col-xl-3 col-md-6 mb-4">
                            <div class="card stat-card">
                                <div class="card-body d-flex align-items-center">
                                    <div class="flex-grow-1">
                                        <div class="text-xs fw-bold text-uppercase mb-1">Active Users</div>
                                        <div class="h5 mb-0 fw-bold"><span id="userCount">10,000</span> Users</div>
                                    </div>
                                    <div class="fs-1 opacity-50"><i class="fa fa-users"></i></div>
                                </div>
                            </div>
                        </div>
                        <!-- other cards -->
                        <div class="col-xl-3 col-md-6 mb-4">
                            <div class="card stat-card">
                                <div class="card-body d-flex align-items-center">
                                    <div class="flex-grow-1">
                                        <div class="text-xs fw-bold text-uppercase mb-1">Active Products</div>
                                        <div class="h5 mb-0 fw-bold"><span id="productCount">500</span> Products</div>
                                    </div>
                                    <div class="fs-1 opacity-50"><i class="fa fa-cubes"></i></div>
                                </div>
                            </div>
                        </div>
                        <div class="col-xl-3 col-md-6 mb-4">
                            <div class="card stat-card">
                                <div class="card-body d-flex align-items-center">
                                    <div class="flex-grow-1">
                                        <div class="text-xs fw-bold text-uppercase mb-1">Items Sold</div>
                                        <div class="h5 mb-0 fw-bold"><span id="itemCount">15,000</span> Items</div>
                                    </div>
                                    <div class="fs-1 opacity-50"><i class="fa fa-tags"></i></div>
                                </div>
                            </div>
                        </div>
                        <div class="col-xl-3 col-md-6 mb-4">
                            <div class="card stat-card">
                                <div class="card-body d-flex align-items-center">
                                    <div class="flex-grow-1">
                                        <div class="text-xs fw-bold text-uppercase mb-1">Total Sales</div>
                                        <div class="h5 mb-0 fw-bold">Rs.<span id="totalSales">150,000.00</span> </div>
                                    </div>
                                    <div class="fs-1 opacity-50"><i class="fa-solid fa-rupee-sign"></i></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Charts -->
                    <div class="row">
                        <div class="col-lg-7 mb-4">
                            <div class="card">
                                <div class="card-header"><i class="fas fa-chart-line me-2"></i>Sales Over Time</div>
                                <div class="card-body">
                                    <canvas id="salesChart"></canvas>
                                </div>
                            </div>
                        </div>
                        <div class="col-lg-5 mb-4">
                            <div class="card">
                                <div class="card-header"><i class="fas fa-chart-pie me-2"></i>Sales by Platform</div>
                                <div class="card-body">
                                    <canvas id="platformChart"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Recent Orders Table -->
                    <div class="card">
                        <div class="card-header"><i class="fas fa-history me-2"></i>Recent Orders</div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-striped table-hover text-center">
                                    <thead>
                                        <tr>
                                            <th>Order ID</th>
                                            <th>User</th>
                                            <th>Date</th>
                                            <th>Total</th>
                                            <th>Status</th>
                                        </tr>
                                    </thead>
                                    <tbody id="order-table">
                                        <tr id="order-table-tr">
                                            <td>#<span id="order-table-id">12543</span></td>
                                            <td id="order-table-user">John Doe</td>
                                            <td id="order-table-date">2023-10-26</td>
                                            <td>Rs.<span id="order-table-total">200.00</span></td>
                                            <td id="order-table-status">Shipped</td>
                                        </tr>
                                        <!-- more rows -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </main>

            </div>
        </div>

        <!-- Scripts -->
        <script src="https://code.jquery.com/jquery-3.6.3.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="assets/js/admin-script.js"></script>
        <script src="assets/js/notification.js"></script>
        <script src="assets/js/admin-sign-out.js"></script>
        <script src="assets/js/admin-dashboard.js"></script>

        <!-- Scroll to Top Button -->
        <button class="scroll-to-top" id="scrollToTop" title="Scroll to top">
            <i class="fas fa-arrow-up"></i>
        </button>
    </body>

</html>
