<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Account | GameCrate.lk</title>
        <link rel="icon" type="image/png" href="assets/images/logo.png">

        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- Font Awesome -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css"/>

        <!-- Custom CSS -->
        <link rel="stylesheet" href="assets/css/style.css">
        <link rel="stylesheet" href="assets/css/notification.css">
    </head>
    <body onload="loadHeaderFooter();loadData();">

        <!-- NAVBAR GOES HERE -->
        <div id="header"></div>

        <!-- PAGE-SPECIFIC CONTENT -->
        <main class="container" style="padding-top: 120px; padding-bottom: 50px;">
            <h1 class="section-title mb-5">Your Account</h1>
            <div class="row">
                <!-- Left Side Navigation -->
                <div class="col-lg-3">
                    <div class="mb-5">
                        <div class="d-flex flex-column align-items-center text-center">
                            <div class="thumbnail mb-3">
                                <img
                                    src=""
                                    alt="avatar" id="avatar" 
                                    style="width: 100px; height: 100px; border-radius: 50%;" />
                            </div>
                            <div class="ms-3">
                                <h5 class="title mb-0" id="username">Hello, User</h5>
                                <span class="joining-date" id="since">Member since [Date]</span>
                            </div>
                        </div>
                    </div>
                    <div class="nav flex-column nav-pills profile-nav" id="v-pills-tab" role="tablist" aria-orientation="vertical">
                        <button class="nav-link active" id="v-pills-profile-tab" data-bs-toggle="pill" data-bs-target="#v-pills-profile" type="button" role="tab">
                            <i class="fas fa-user-circle me-2"></i> Profile Details
                        </button>
                        <button class="nav-link" id="v-pills-addresses-tab" data-bs-toggle="pill" data-bs-target="#v-pills-addresses" type="button" role="tab">
                            <i class="fas fa-map-marker-alt me-2"></i> Shipping Addresses
                        </button>
                        <button class="nav-link" id="v-pills-security-tab" data-bs-toggle="pill" data-bs-target="#v-pills-security" type="button" role="tab">
                            <i class="fas fa-shield-alt me-2"></i> Security
                        </button>
                        <button class="nav-link" id="v-pills-orders-tab" data-bs-toggle="pill" data-bs-target="#v-pills-orders" type="button" role="tab">
                            <i class="fas fa-history me-2"></i> Order History
                        </button>
                        <button class="nav-link" data-bs-toggle="pill" type="button" onclick="signOut();">
                            <i class="fas fa-sign-out me-2"></i> Logout
                        </button>
                    </div>
                </div>

                <!-- Right Side Content -->
                <div class="col-lg-9">
                    <p class="text-danger" id="message"></p>
                    <div class="tab-content profile-content" id="v-pills-tabContent">

                        <!-- Profile Details Pane -->
                        <div class="tab-pane fade show active" id="v-pills-profile" role="tabpanel">
                            <div class="card p-4">
                                <h4 class="mb-4 accent-text">Edit Your Profile</h4>
                                <form>
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label for="firstName" class="form-label">First Name</label>
                                            <input type="text" class="form-control" id="firstName">
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label for="lastName" class="form-label">Last Name</label>
                                            <input type="text" class="form-control" id="lastName">
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label for="mobile" class="form-label">Mobile Number</label>
                                            <input type="text" class="form-control" id="mobile">
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label for="email" class="form-label">Email Address</label>
                                            <input type="email" class="form-control" id="email" readonly>
                                            <small class="form-text text-white-50">Email cannot be changed.</small>
                                        </div>
                                    </div>
                                    <button onclick="saveProfileChanges(event);" type="submit" class="btn btn-primary mt-3">Save Changes</button>
                                </form>
                            </div>
                        </div>

                        <!-- Shipping Addresses Pane -->
                        <div class="tab-pane fade" id="v-pills-addresses" role="tabpanel">
                            <div class="card p-4 mb-3">
                                <h4 class="mb-4 accent-text">Manage Addresses</h4>
                                <form>
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label for="lineOne" class="form-label">Address Line 1</label>
                                            <input type="text" class="form-control" id="lineOne">
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label for="lineTwo" class="form-label">Address Line 2</label>
                                            <input type="text" class="form-control" id="lineTwo">
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label for="citySelect" class="form-label">City</label>
                                            <select id="citySelect" class="form-select">
                                                <option value="0">Select</option>
                                            </select>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label for="postalCode" class="form-label">Postal Code</label>
                                            <input type="text" class="form-control" id="postalCode">
                                        </div>
                                    </div>
                                    <button onclick="saveAddress(event);" type="submit" class="btn btn-primary mt-3" id="saveAddressBtn">Save Address</button>
                                    <button onclick="updateAddressInDatabase(event);" type="submit" class="btn btn-primary mt-3" id="updateAddressBtn" style="display: none;">Update Address</button>
                                </form>
                            </div>

                            <div class="accordion" id="addresses-accordion"></div>
                            <div id="no-address-message" class="text-center text-muted mt-4"></div>
                        </div>
                        <!-- Security Pane -->
                        <div class="tab-pane fade" id="v-pills-security" role="tabpanel">
                            <div class="card p-4">
                                <h4 class="mb-4 accent-text">Change Password</h4>
                                <form>
                                    <div class="mb-3">
                                        <label for="currentPassword" class="form-label">Current Password</label>
                                        <input type="password" class="form-control" id="currentPassword">
                                    </div>
                                    <div class="mb-3">
                                        <label for="newPassword" class="form-label">New Password</label>
                                        <input type="password" class="form-control" id="newPassword">
                                    </div>
                                    <div class="mb-3">
                                        <label for="confirmPassword" class="form-label">Confirm New Password</label>
                                        <input type="password" class="form-control" id="confirmPassword">
                                    </div>
                                    <button onclick="resetPassword(event)" type="submit" class="btn btn-primary mt-3">Reset Password</button>
                                </form>
                            </div>
                        </div>

                        <!-- Purchase History Pane -->
                        <div class="tab-pane fade" id="v-pills-orders" role="tabpanel" aria-labelledby="v-pills-orders-tab">
                            <div class="card p-4">
                                <h4 class="mb-4 accent-text">Order History</h4>

                                <div class="accordion" id="purchaseHistoryAccordion"></div>
                                <div id="no-orders-message" class="text-center text-muted mt-4"></div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </main>

        <!-- FOOTER GOES HERE -->
        <div id="footer"></div>

        <!-- SCRIPTS -->
        <script src="https://code.jquery.com/jquery-3.6.3.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="assets/js/script.js"></script>
        <script src="assets/js/notification.js"></script>
        <script src="assets/js/sign-out.js"></script>
        <script src="assets/js/my-account.js"></script>

        <!-- Scroll to Top Button -->
        <button class="scroll-to-top" id="scrollToTop" title="Scroll to top">
            <i class="fas fa-arrow-up"></i>
        </button>

    </body>
</html>
