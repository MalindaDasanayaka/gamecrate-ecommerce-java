<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Advanced Search | GameCrate.lk</title>
        <link rel="icon" type="image/png" href="assets/images/logo.png">

        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- Font Awesome -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css" />

        <!-- Custom CSS -->
        <link rel="stylesheet" href="assets/css/style.css">
        <link rel="stylesheet" href="assets/css/notification.css">
    </head>

    <body onload="loadHeaderFooter();loadData();">

        <!-- NAVBAR GOES HERE -->
        <div id="header"></div>

        <!-- PAGE-SPECIFIC CONTENT GOES HERE -->
        <div class="container" style="padding-top: 100px;">
            <header class="py-4 text-center">
                <h1 class="display-5 fw-bold">Find Your Next Game</h1>
                <p class="text-white-50">Filter through our massive collection of games and consoles.</p>
            </header>
            <div class="row">
                <!-- Filters Sidebar -->
                <div class="col-lg-3">
                    <div class="p-4 rounded" style="background-color: var(--secondary-bg);">
                        <h4 class="mb-4">Filters</h4>
                            <!-- Category -->
                            <div class="mb-4">
                                <label class="form-label accent-text">Category</label>
                                <div id="category-options"></div>
                            </div>

                            <!-- Platform -->
                            <div class="mb-4">
                                <label class="form-label accent-text">Platform</label>
                                <div id="platform-options"></div>
                            </div>

                            <!-- Genre -->
                            <div class="mb-4">
                                <label class="form-label accent-text">Genre</label>
                                <div id="genre-options"></div>
                            </div>
                            <!-- Price Range -->
                            <div class="mb-4">
                                <label class="form-label accent-text">Price Range</label>
                                <p id="priceRangeLabel">Rs.0 - Rs.1000000</p>
                                <div class="range-slider-container">
                                    <input type="range" class="form-range" min="0" max="10000" step="10" value="0" id="rangeMin">
                                    <input type="range" class="form-range" min="0" max="10000" step="10" value="10000" id="rangeMax">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 mb-2" onclick="searchProduct(0);">Apply Filters</button>
                            <button type="submit" class="btn btn-outline-dark w-100" onclick="reset();">Reset All</button>
                    </div>
                </div>
                <!-- Search Results -->
                <div class="col-lg-9">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="text-white-50">Showing <span id="first-result">1</span> - <span id="last-result">12</span> of <span id="all-item-count">86</span> results</span>
                        <select class="form-select w-auto"
                                style="background-color: var(--secondary-bg); color: var(--text-color);" id="st-sort">
                            <option value="0" selected>Sort by Latest</option>
                            <option value="1">Sort by Oldest</option>
                            <option value="2">Sort by Name: A to Z</option>
                            <option value="3">Sort by Name: Z to A</option>
                            <option value="4">Sort by Price: Low to High</option>
                            <option value="5">Sort by Price: High to Low</option>
                        </select>
                    </div>
                    <div class="row" id="st-product-container">
                        <!-- Repeat Product Cards here -->
                        <div class="col-md-6 col-lg-4" id="st-product">
                            <div class="product-card">
                                <a href="#" id="st-product-a-1">
                                    <img src="https://via.placeholder.com/400x300.png/232946/FFFFFF?text=Cyberpunk+2077"
                                         class="card-img-top" alt="Cyberpunk 2077" id="st-product-img-1">
                                </a>
                                <div class="card-body">
                                    <h5 class="card-title" id="st-product-title-1">Cyberpunk 2077 (PS5)</h5>
                                    <p class="card-text">Rs.<span id="st-product-price-1">59.99</span></p>
                                    <a href="#" class="btn btn-outline-dark w-100 mb-2" id="st-product-a-2"><i class="fas fa-eye me-2"></i> View Details</a>
                                    <a href="#" class="btn btn-primary w-100" id="st-product-add-to-cart"><i class="fas fa-cart-plus me-2"></i> Add to Cart</a>
                                </div>
                            </div>
                        </div>
                        <!-- ... -->
                    </div>
                    <div class="text-center" id="st-pagination-container">
                        <a href="#" class="pagination-btn" id="st-pagination-button">Prev</a>
                    </div>
                    <div id="no-address-message" class="text-center text-muted mt-4"></div>
                </div>
                
            </div>
        </div>

        <!-- FOOTER GOES HERE -->
        <div id="footer"></div>

        <!-- JQuery -->
        <script src="https://code.jquery.com/jquery-3.6.3.min.js"></script>
        <!-- Bootstrap JS Bundle -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Custom JS -->
        <script src="assets/js/script.js"></script>
        <script src="assets/js/notification.js"></script>
        <script src="assets/js/search.js"></script>
        
        <!-- Scroll to Top Button -->
        <button class="scroll-to-top" id="scrollToTop" title="Scroll to top">
            <i class="fas fa-arrow-up"></i>
        </button>
    </body>

</html>
