<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cart | GameCrate.lk</title>
        <link rel="icon" type="image/png" href="assets/images/logo.png">

        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- Font Awesome -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css" />

        <!-- Custom CSS -->
        <link rel="stylesheet" href="assets/css/style.css">
        <link rel="stylesheet" href="assets/css/notification.css">
    </head>

    <body onload="loadHeaderFooter();loadCartItems();">

        <!-- NAVBAR GOES HERE -->
        <div id="header"></div>

        <!-- PAGE-SPECIFIC CONTENT GOES HERE -->
        <div class="container" style="padding-top: 120px;">
            <h1 class="section-title">Your Shopping Cart</h1>
            <div class="d-flex justify-content-end mb-3">
                <button class="btn btn-danger" id="clearCartBtn" onclick="clearCart();"><i class="fas fa-trash me-2"></i>Clear Shopping Cart</button>
            </div>
            <div class="row">
                <div class="col-12">
                    <div class="table-responsive">
                        <table class="table text-center">
                            <thead>
                                <tr>
                                    <th scope="col" colspan="2">Product</th>
                                    <th scope="col">Price</th>
                                    <th scope="col">Quantity</th>
                                    <th scope="col">Subtotal</th>
                                    <th scope="col"></th>
                                </tr>
                            </thead>
                            <tbody id="cart-item-container">
                            
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="offset-lg-7 col-lg-5">
                    <div class="p-4 rounded" id="cart-summary" style="background-color: var(--secondary-bg);">
                        <h4 class="mb-4">Cart Summary</h4>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Quantities</span>
                            <span id="order-total-quantity">0</span>
                        </div>
                        <hr style="border-color: var(--border-color);">
                        <div class="d-flex justify-content-between fw-bold fs-5">
                            <span>Subtotal</span>
                            <span class="accent-text">Rs.<span id="order-total-amount">0.00</span></span>
                        </div>
                        <a href="checkout.html" class="btn btn-primary w-100 mt-4">Proceed to Checkout</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- FOOTER GOES HERE -->
        <div id="footer"></div>

        <!-- JQuery -->
        <script src="https://code.jquery.com/jquery-3.6.3.min.js"></script>
        <!-- Bootstrap JS Bundle -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Custom JS -->
        <script src="assets/js/script.js"></script>
        <script src="assets/js/notification.js"></script>
        <script src="assets/js/cart.js"></script>
        
        <!-- Scroll to Top Button -->
        <button class="scroll-to-top" id="scrollToTop" title="Scroll to top">
            <i class="fas fa-arrow-up"></i>
        </button>

    </body>

</html>
